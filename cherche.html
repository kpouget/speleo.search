<!DOCTYPE html>
<html>
  <head>
    <title>Cherche le trou du Lot</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">

    <meta name="viewport" content="width=device-width">
    <meta name="theme-color" content="#3367D6">
    <link rel="manifest" href="manifest.pwa" crossorigin="use-credentials">
    <link rel="apple-touch-icon" href="/speleo.png">
    <link rel="shortcut icon" href="favicon.png" type="image/png"/>

    <script type="text/javascript" src="libs.js"></script>
    <script type="text/javascript" src="trouve.js"></script>
    <script type="text/javascript" src="simple_map.js"></script>

    <script type="text/javascript" src="pwa.js"></script>

    <style>
      #targetName {
          font-weight: bold;
      }
    </style>
  </head>
  <body>
    <ul>
      <li><a href="/">Retour à l'Index</a></li>
    </ul>

    <button id="find-me">Localiser</button>
    <button id="follow-me">Suivre</button>
    <button id="forget-me">Stopper</button>

    <p id="status"></p>
    <p id="tracking">.</p>
    <p id="loc_age" data-start_ts="0">.</p>
    <p id="gps_accuracy">.</p>
    <hr/><hr/>
    <p id="targetName"></p>
    <hr/>
    <p>
      <span id="targetLoc"></span>
      (Cible)
    </p>
    <p>
      <span id="lonlat">(non calculée)</span>
      (Position actuelle)
    </p>
    <hr/><hr/>
    <ul>
      <li>Cible <a id="geo-target" target="_blank"></a>, <a id="osm-target" target="_blank"></a>
      </li>
      <li>Position actuelle <a id="geo-current" target="_blank"></a>, <a id="osm-current" target="_blank"></a>
      </li>
    </ul>
    <hr/><hr/>
    <p id="bearing"></p>
    <p id="heading"></p>
    <hr/>
    <p><span id="distance"></span>, <span id="north"></span>, <span id="east"></span></p>
    <hr/><hr/>

    <p>
      <canvas id="simple_map" width="1" height="1" style="border:0px solid #d3d3d3;">
        Your browser does not support the HTML5 canvas tag.
      </canvas>
    </p>
    <p id="version"></p>
    <script type="text/javascript">
       (function() {
           init_cherche()
      })();
    </script>
  </body>
</html>
