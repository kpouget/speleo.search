<!DOCTYPE html>
<html>
  <head>
    <title>Cherche le trou du Lot</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width">
    <meta name="theme-color" content="#3367D6">
    <link rel="manifest" href="manifest.pwa" crossorigin="use-credentials">
    <link rel="apple-touch-icon" href="/speleo.png">
    <link rel="shortcut icon" href="favicon.png" type="image/png"/>

    <script type="text/javascript" src="libs.js"></script>
    <script type="text/javascript" src="trouve.js"></script>
    <script type="text/javascript" src="pwa.js"></script>

    <style>
      #targetName {
          font-weight: bold;
      }
    </style>
  </head>
  <body>
    <button id="find-me">Localiser</button>

    <p id="status"></p>
    <p id="tracking">.</p>
    <p id="loc_age" data-start_ts="0" style="display: none">.</p>
    <p id="gps_accuracy">.</p>
    <hr/>
    <p id="heading"></p>
    <hr/>
    <p>Position actuelle:</p>
    <p id="lonlat">(non calculée)</p>
    <hr/>
    <input type="text" id="search" placeholder="Filtre ..."/>
    <ul id="cave_list">
{{ data }}
    </ul>
    <p id="version"></p>
    <script type="text/javascript">
      (function() {
          init_index()
      })();
    </script>
  </body>
</html>
